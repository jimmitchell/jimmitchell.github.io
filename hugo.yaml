baseURL: https://jimmitchell.github.io/
locale: en-us
timeZone: America/Los_Angeles
title: Jim Mitchell
theme: mnml

enableRobotsTXT: true

pagination:
  pagerSize: 20

# Posts are filed in content/posts/<yyyy>/<mm>/ and served at
# /<yyyy>/<mm>/<dd>/<file-name>/. The Micropub Worker builds the same URLs, so
# change both together.
permalinks:
  page:
    posts: /:year/:month/:day/:contentbasename/

taxonomies:
  category: categories

# Posts imported from Micro.blog contain inline HTML (figures, video, links).
markup:
  goldmark:
    renderer:
      unsafe: true

params:
  description: Personal site and writing of Jim Mitchell.
  author:
    name: Jim Mitchell
    avatar: "images/avatar.png"              # path or URL to an avatar image
  mainSections: [posts]

  # Profiles that link back here, for rel="me" verification (Mastodon shows a
  # checkmark once its profile links to this site too).
  rel_me:
    - https://indieweb.social/@jimmitchell
    - https://github.com/jimmitchell

  # mnml options (all default to off/blank)
  fediverse_creator: "@jimmitchell@indieweb.social"     # e.g. @jim@mastodon.social
  use_short_date: false
  narrow_header: false
  hide_avatar: false
  custom_avatar: ""
  pinned_category: ""
  home_category: ""
  show_full_post: false
  show_read_time: false
  enable_code_copy_button: true
  category_full_post: false
  show_categories: true
  show_category_count: true
  photos_category: "Photos"
  all_formats: false
  masonry_layout: false
  full_width_photos: false
  single_image: false
  search_results: 10
  hide_copyright: false
  footer_rss: true
  hide_credit: true

  # IndieAuth via indiekey.id. Set site_id to the ID IndieKey shows after you
  # add this domain. micropub is the Worker in the jimmitchell/micropub repo; it
  # must match the URL registered under IndieKey > Resource servers exactly.
  indieauth:
    site_id: "snqct4j1ek792jfp"
    micropub: "https://jimmitchell-micropub.jim-983.workers.dev/"

menus:
  main:
    - name: Archives
      pageRef: /archive
      weight: 10
    - name: Photos
      pageRef: /photos
      weight: 15
    - name: Search
      pageRef: /search
      weight: 20
    - name: Random
      pageRef: /random
      weight: 25
    - name: About
      pageRef: /about
      weight: 30

services:
  rss:
    limit: 20

# A JSON Feed (jsonfeed.org) alongside RSS, at /feed.json. The RSS feed is
# also served at /feed.xml, where Micro.blog had it, so subscribers following
# the old domain's redirect still find it.
mediaTypes:
  application/feed+json:
    suffixes: [json]

outputFormats:
  jsonfeed:
    mediaType: application/feed+json
    baseName: feed
    isPlainText: true
  feedxml:
    mediaType: application/rss+xml
    baseName: feed
    isPlainText: true
    noAlternative: true

outputs:
  home: [html, rss, jsonfeed, feedxml]

# Expose Micropub uploads in static/media to Hugo's image processing so the
# photos grid can generate thumbnails. Declaring an assets mount replaces the
# default one, so assets/ is re-added explicitly.
module:
  # The version CI builds with (HUGO_VERSION in .github/workflows/hugo.yaml);
  # an older local Hugo warns that it doesn't match.
  hugoVersion:
    min: "0.167.0"
    extended: true
  mounts:
    - source: assets
      target: assets
    - source: static/media
      target: assets/media
