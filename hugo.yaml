baseURL: https://jimmitchell.github.io/
locale: en-us
timeZone: America/Los_Angeles
title: Jim Mitchell

enableRobotsTXT: true

pagination:
  pagerSize: 20

# Posts are filed in content/posts/<yyyy>/<mm>/ and served at
# /<yyyy>/<mm>/<dd>/<file-name>/. The Micropub Worker builds the same URLs, so
# change both together.
permalinks:
  page:
    posts: /:year/:month/:day/:contentbasename/

# Future-dated posts stay out of the build until their date. The Micropub
# Worker's cron trigger pushes an empty commit when one falls due, so the next
# build publishes it.
buildFuture: false

taxonomies:
  category: categories

# Posts imported from Micro.blog contain inline HTML (figures, video, links).
markup:
  goldmark:
    renderer:
      unsafe: true

# Theme options are documented in the theme's README:
# https://github.com/jimmitchell/hugo-theme-clodd#configuration
params:
  description: Personal site and writing of Jim Mitchell.
  mainSections: [posts]
  home_intro: "Saved by grace. Wrangler of nerds, herder of cats, and butcher of code, though not always in that order. This is my place on the web to explore technology, design, and simple living through the lens of someone who uses ellipses like punctuation should be optional... Indieweb is punk."

  author:
    name: Jim Mitchell
    bio: "Saved by grace. Wrangler of nerds. Herder of cats. Butcher of code. Abuser of ellipses..."
    avatar: images/avatar.png    # static/images is mounted into assets below
    email: hello@jimmitchell.org # shows the Email reply pill under posts

  # Footer icons and the home page h-card, all rel="me" (Mastodon shows a
  # checkmark once its profile links back here too).
  social:
    mastodon: "@jimmitchell@indieweb.social"
    bluesky: https://bsky.app/profile/jimmitchell.org
    pixelfed: https://pixelfed.social/jimmitchell
    github: https://github.com/jimmitchell

  # IndieAuth via indiekey.id: the site ID IndieKey shows for this domain.
  # micropub is the Worker in the jimmitchell/micropub repo; it must match the
  # URL registered under IndieKey > Resource servers exactly.
  indieauth:
    indiekey: "snqct4j1ek792jfp"
  micropub: "https://jimmitchell-micropub.jim-983.workers.dev/"

  # Webmentions are received by webmention.io for this domain.
  webmentions:
    domain: jimmitchell.github.io

  # Clodd sets note cards flat at the page's colour so articles stand out;
  # here every card gets the same raised surface.
  custom_css: |
    .post-card--note { background: var(--color-surface); }

menus:
  main:
    - name: Archives
      pageRef: /archive
      weight: 10
    - name: Photos
      pageRef: /photos
      weight: 15
    - name: Search
      pageRef: /search
      weight: 20
    - name: Random
      pageRef: /random
      weight: 25
    - name: About
      pageRef: /about
      weight: 30

services:
  rss:
    limit: 20

# Takes the theme's feeds: RSS at /index.xml (copied to /feed.xml, where
# Micro.blog had it, and /feed.rss), Atom at /atom.xml and JSON Feed at
# /feed.json, for the home page and every category. Hugo leaves a theme's
# outputs out unless asked.
outputs:
  _merge: shallow

# The theme, as a Hugo module (needs Go). To try local changes to it:
#   HUGO_MODULE_REPLACEMENTS="github.com/jimmitchell/hugo-theme-clodd -> ../../hugo-theme-clodd" hugo server
#
# static/media (Micropub uploads) and static/images (the avatar) are mounted
# into assets too, so Hugo can size and convert the pictures and draw the
# avatar on share cards. Declaring an assets mount replaces the default one,
# so assets/ is re-added explicitly.
module:
  imports:
    - path: github.com/jimmitchell/hugo-theme-clodd
  # The version CI builds with (HUGO_VERSION in .github/workflows/hugo.yaml);
  # an older local Hugo warns that it doesn't match.
  hugoVersion:
    min: "0.167.0"
    extended: true
  mounts:
    - source: assets
      target: assets
    - source: static/media
      target: assets/media
    - source: static/images
      target: assets/images
